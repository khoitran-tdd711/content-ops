# Render "Blueprint" — lets Render read this file and pre-fill the New Web
# Service form for you (disk, env vars, build/start commands). You can also
# ignore this file entirely and fill the same fields in by hand in the
# Render dashboard; see README.md for the click-by-click version.
services:
  - type: web
    name: content-ops
    runtime: python
    plan: starter  # cheapest plan that supports persistent disks (needed for SQLite)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    disk:
      name: content-ops-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////var/data/social_ops.db
      - key: BASE_URL
        sync: false  # set this to your Render URL after first deploy, e.g. https://content-ops.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ONEUP_API_KEY
        sync: false
