{% extends "base.html" %}
{% block title %}Calendar{% endblock %}
{% block head %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.11/index.global.min.js"></script>
{% endblock %}
{% block content %}
<style>
  .cal-event-compact {
    display: flex; align-items: center; gap: 4px; padding: 1px 5px;
    border-radius: 5px; overflow: hidden; line-height: 1.3;
  }
  .cal-event-compact .time {
    font-size: 10px; font-weight: 700; opacity: .85; flex-shrink: 0; white-space: nowrap;
  }
  .cal-event-compact .txt {
    font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-event-rich {
    display: block; padding: 7px 10px; border-radius: 10px; overflow: hidden;
    border-left: 3px solid rgba(255,255,255,.55);
  }
  .cal-event-rich .time { font-size: 11px; font-weight: 700; opacity: .8; margin-bottom: 2px; }
  .cal-event-rich .proj {
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; line-height: 1.3;
    margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .cal-event-rich .acct { font-size: 11.5px; font-weight: 600; opacity: .85; }
  .fc-daygrid-event { border: none !important; background: transparent !important; }
  .fc-timegrid-event, .fc-daygrid-event { padding: 0 !important; }
  .preview-strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 6px; }
  .preview-strip img {
    width: 72px; height: 72px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--border); flex-shrink: 0; background: var(--bg); cursor: pointer;
  }
  #preview-lightbox { border: none; background: transparent; padding: 0; max-width: 92vw; max-height: 92vh; }
  #preview-lightbox::backdrop { background: rgba(0,0,0,.8); }
  #preview-lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 10px; display: block; cursor: pointer; }
</style>
<div class="calendar-wide">
<h2>Content calendar</h2>
<p class="muted">
  Legend:
  <span class="badge" style="background:#2E6F68;color:#fff">Ordered</span>
  <span class="badge" style="background:#6F8EFF;color:#fff">In Production</span>
  <span class="badge" style="background:#F5B942;color:#0D302D">Ready</span>
  <span class="badge" style="background:#134440;color:#fff">Scheduled</span>
  <span class="badge" style="background:#3FD27E;color:#0D302D">Published</span>
</p>
<p class="muted">Drag an item to a new day to reschedule it. Click it to publish or open it.</p>

<div style="margin:10px 0 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap">
  <label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:500">
    <input type="checkbox" class="cal-filter" value="planned" checked style="width:auto;margin:0"> Planned
  </label>
  <label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:500">
    <input type="checkbox" class="cal-filter" value="scheduled" checked style="width:auto;margin:0"> Scheduled
  </label>
  <label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:500">
    <input type="checkbox" class="cal-filter" value="published" checked style="width:auto;margin:0"> Published
  </label>
  <input type="text" id="cal-search" placeholder="Search tasks…" style="width:220px;margin:0 0 0 auto">
</div>

<div id="calendar"></div>
</div>

<dialog id="event-modal" style="border:none;border-radius:20px;padding:0;width:420px;max-width:90vw">
  <div class="card" style="margin:0;border:none">
    <h3 id="event-modal-title" style="margin:0 0 14px"></h3>
    <div id="event-modal-preview"></div>
    <form id="event-modal-publish-form" method="post">
      <label>Publish date &amp; time</label>
      <input type="datetime-local" id="event-modal-datetime" name="scheduled_at" required>

      <label>Description</label>
      <textarea id="event-modal-caption" name="caption" placeholder="Caption for this post"></textarea>

      <div style="display:flex;gap:10px;margin-top:14px">
        <a id="event-modal-modify" class="btn secondary" style="flex:1;text-align:center">To modify</a>
        <button class="btn" type="submit" style="flex:1">Confirm &amp; publish</button>
      </div>
    </form>
    <button type="button" class="btn secondary" style="width:100%;margin-top:10px"
            onclick="document.getElementById('event-modal').close()">Cancel</button>
  </div>
</dialog>

<dialog id="preview-lightbox">
  <img id="preview-lightbox-img" src="" alt="Preview">
</dialog>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const calendarEl = document.getElementById('calendar');
  const filterBoxes = document.querySelectorAll('.cal-filter');
  const searchInput = document.getElementById('cal-search');
  const modal = document.getElementById('event-modal');

  function activeBuckets() {
    return Array.from(filterBoxes).filter(cb => cb.checked).map(cb => cb.value);
  }

  function matchesSearch(e, term) {
    if (!term) return true;
    const haystack = ((e.projectTitle || e.title || '') + ' ' + (e.accountLabel || '')).toLowerCase();
    return haystack.includes(term);
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Shows what will actually get sent to OneUp — same Drive link handling
  // as the real publish, just read-only. Zips can take a few seconds to
  // download and unpack, so this shows a loading state while it works, and
  // ignores its own result if the boss has already clicked into a
  // different task by the time it comes back.
  let previewRequestId = 0;
  function loadMediaPreview(orderId) {
    const wrap = document.getElementById('event-modal-preview');
    const thisRequest = ++previewRequestId;
    wrap.innerHTML = '<p class="muted" style="margin:0 0 10px;font-size:12px">Loading preview…</p>';
    fetch('/orders/' + orderId + '/media-preview')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (thisRequest !== previewRequestId) return;
        if (data.error) {
          wrap.innerHTML = '<p class="muted" style="margin:0 0 10px;font-size:12px">' + escapeHtml(data.error) + '</p>';
          return;
        }
        if (!data.images.length) {
          wrap.innerHTML = '<p class="muted" style="margin:0 0 10px;font-size:12px">No preview available.</p>';
          return;
        }
        wrap.innerHTML = '<div class="preview-strip">' +
          data.images.map(function (u) {
            return '<img src="' + u + '" loading="lazy" onclick="openLightbox(this.src)">';
          }).join('') +
          '</div>';
      })
      .catch(function () {
        if (thisRequest !== previewRequestId) return;
        wrap.innerHTML = '<p class="muted" style="margin:0 0 10px;font-size:12px">Couldn\'t load a preview.</p>';
      });
  }

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    height: 'auto',
    editable: true,
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,dayGridWeek,listMonth'
    },
    events: function (info, successCallback, failureCallback) {
      fetch("{{ url_for('orders_json') }}")
        .then(r => r.json())
        .then(data => {
          const active = activeBuckets();
          const term = (searchInput.value || '').trim().toLowerCase();
          successCallback(data.events.filter(e => active.includes(e.bucket) && matchesSearch(e, term)));
        })
        .catch(failureCallback);
    },
    // Chronological first (13:30 before 18:00 before 21:00), then grouped
    // by project name as a tie-break. Since every language of the same
    // project is normally scheduled at the same time, this reads as both
    // "in time order" and "same project together" at once — the earlier
    // version sorted by project name first, which scrambled the time order.
    eventOrder: function (a, b) {
      const sa = a.extendedProps.scheduledAt || '';
      const sb = b.extendedProps.scheduledAt || '';
      if (sa < sb) return -1;
      if (sa > sb) return 1;
      const ta = (a.extendedProps.projectTitle || a.title || '').toLowerCase();
      const tb = (b.extendedProps.projectTitle || b.title || '').toLowerCase();
      if (ta < tb) return -1;
      if (ta > tb) return 1;
      const aa = (a.extendedProps.accountLabel || '').toLowerCase();
      const ab = (b.extendedProps.accountLabel || '').toLowerCase();
      if (aa < ab) return -1;
      if (aa > ab) return 1;
      return 0;
    },
    eventContent: function (arg) {
      const props = arg.event.extendedProps;
      const bg = arg.event.backgroundColor || '#6B7280';
      const fg = arg.event.textColor || '#fff';
      const title = props.projectTitle || arg.event.title;
      const account = props.accountLabel || '';
      // Card start/end dates are date-only (no time) so drag-and-drop can
      // move an item between days without touching its pub time — the real
      // pub time lives in scheduledAt, set once a time has actually been
      // chosen (via the publish-confirmation popup or the Board).
      const start = props.scheduledAt ? new Date(props.scheduledAt) : null;
      const timeShort = start
        ? start.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
        : '';
      const timeLong = start
        ? start.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
        : '';

      if (arg.view.type === 'dayGridMonth') {
        return {
          html:
            '<div class="cal-event-compact" style="background:' + bg + ';color:' + fg + '">' +
              (timeShort ? '<span class="time">' + timeShort + '</span>' : '') +
              '<span class="txt">' + escapeHtml(title) + '</span>' +
            '</div>'
        };
      }
      return {
        html:
          '<div class="cal-event-rich" style="background:' + bg + ';color:' + fg + '">' +
            (timeLong ? '<div class="time">' + timeLong + '</div>' : '') +
            '<div class="proj">' + escapeHtml(title) + '</div>' +
            (account ? '<div class="acct">' + escapeHtml(account) + '</div>' : '') +
          '</div>'
      };
    },
    eventClick: function (info) {
      info.jsEvent.preventDefault();
      const props = info.event.extendedProps;
      const label = (props.projectTitle || info.event.title) + (props.accountLabel ? ' — ' + props.accountLabel : '');
      document.getElementById('event-modal-title').textContent = label;
      document.getElementById('event-modal-datetime').value = props.scheduledAt || (info.event.startStr.slice(0, 10) + 'T12:00');
      document.getElementById('event-modal-caption').value = props.caption || '';
      document.getElementById('event-modal-modify').href = info.event.url;
      document.getElementById('event-modal-publish-form').action = '/orders/' + info.event.id + '/publish-now';
      loadMediaPreview(info.event.id);
      modal.showModal();
    },
    eventDrop: function (info) {
      const newDate = info.event.startStr.slice(0, 10);
      const existingTime = (info.event.extendedProps.scheduledAt || '').slice(11, 16) || '12:00';
      fetch(`/orders/${info.event.id}/set-date`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'scheduled_at=' + encodeURIComponent(newDate + 'T' + existingTime)
      }).catch(function () { info.revert(); });
    }
  });

  const lightbox = document.getElementById('preview-lightbox');
  lightbox.addEventListener('click', function () { lightbox.close(); });
  window.openLightbox = function (src) {
    document.getElementById('preview-lightbox-img').src = src;
    lightbox.showModal();
  };

  filterBoxes.forEach(function (cb) {
    cb.addEventListener('change', function () { calendar.refetchEvents(); });
  });

  let searchDebounce;
  searchInput.addEventListener('input', function () {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function () { calendar.refetchEvents(); }, 250);
  });

  calendar.render();
});
</script>
{% endblock %}
