{% extends "base.html" %}
{% block title %}Calendar{% endblock %}
{% block head %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/fullcalendar/6.1.11/index.global.min.js"></script>
{% endblock %}
{% block content %}
<style>
  .cal-event-compact {
    display: flex; align-items: center; gap: 4px; padding: 1px 16px 1px 5px;
    border-radius: 5px; overflow: hidden; line-height: 1.3; position: relative;
  }
  .cal-event-compact .time {
    font-size: 10px; font-weight: 700; opacity: .85; flex-shrink: 0; white-space: nowrap;
  }
  .cal-event-compact .txt {
    font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-event-rich {
    display: block; padding: 7px 10px; border-radius: 10px; overflow: hidden;
    border-left: 3px solid rgba(255,255,255,.55); position: relative;
  }
  .cal-event-rich .time { font-size: 11px; font-weight: 700; opacity: .8; margin-bottom: 2px; }
  .cal-event-rich .proj {
    font-family: 'Sora', sans-serif; font-weight: 700; font-size: 13px; line-height: 1.3;
    margin-bottom: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; padding-right: 16px;
  }
  .cal-event-rich .acct { font-size: 11.5px; font-weight: 600; opacity: .85; }
  /* Small platform logo badge in the corner of every Calendar card, so
     it's obvious at a glance whether something's an Instagram, LinkedIn,
     Facebook, or TikTok post without opening it. */
  .cal-platform-badge {
    position: absolute; top: 3px; right: 3px; width: 14px; height: 14px;
    border-radius: 50%; background: rgba(255,255,255,.92); display: flex;
    align-items: center; justify-content: center; flex-shrink: 0;
  }
  .cal-event-compact .cal-platform-badge { top: 1px; right: 1px; width: 12px; height: 12px; }
  .cal-platform-badge svg { width: 9px; height: 9px; }
  .cal-event-compact .cal-platform-badge svg { width: 7px; height: 7px; }
  .fc-daygrid-event { border: none !important; background: transparent !important; }
  .fc-timegrid-event, .fc-daygrid-event { padding: 0 !important; }
  .preview-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; }
  /* Each photo in the publish popup is now its own draggable, removable
     tile (not a bare <img>) so the boss can drop-to-reorder or click the
     x to drop a photo before it goes out — see savePreviewOrder(). */
  .preview-item { position: relative; flex-shrink: 0; cursor: grab; touch-action: none; }
  .preview-item.dragging { opacity: .35; }
  .preview-item.drag-over { outline: 2px dashed var(--border); outline-offset: 2px; }
  .preview-item img {
    width: 150px; height: 150px; object-fit: cover; border-radius: 10px;
    border: 1px solid var(--border); flex-shrink: 0; background: var(--bg); cursor: pointer; display: block;
  }
  .preview-remove {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.65); color: #fff; font-size: 15px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .preview-remove:hover { background: rgba(220,76,76,.9); }
  #preview-lightbox { border: none; background: transparent; padding: 0; max-width: 92vw; max-height: 92vh; }
  #preview-lightbox::backdrop { background: rgba(0,0,0,.8); }
  #preview-lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 10px; display: block; cursor: pointer; }
  #event-modal-caption { min-height: 160px; resize: vertical; max-width: 100%; box-sizing: border-box; }
  /* Platform filter chips — colorful (and clearly "on") when checked,
     grayscale and dim when off, so it reads at a glance which platforms
     are showing without needing a legend. */
  .platform-chip {
    display: inline-flex; align-items: center; gap: 7px; margin: 0;
    padding: 6px 14px 6px 10px; border-radius: 999px; border: 1.5px solid var(--border);
    cursor: pointer; font-weight: 600; font-size: 13px; user-select: none;
    transition: background .15s, border-color .15s, filter .15s;
    filter: grayscale(1) opacity(.5);
  }
  .platform-chip input { display: none; }
  .platform-chip svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--accent); }
  .platform-chip:has(input:checked) { border-color: var(--accent); background: var(--accent-tint); filter: none; }
  .platform-chip[data-platform="instagram"] { --accent: #C13584; --accent-tint: rgba(193,53,132,.12); }
  .platform-chip[data-platform="linkedin"] { --accent: #0A66C2; --accent-tint: rgba(10,102,194,.12); }

  /* FullCalendar ships its own light-themed defaults via these CSS custom
     properties (grid lines, day headers, buttons, the "today" highlight)
     -- our own --bg/--card/--border/--text variables don't reach inside
     it automatically, so night mode needs to hand FullCalendar its own
     dark values explicitly. */
  [data-theme="dark"] #calendar {
    --fc-page-bg-color: var(--card);
    --fc-neutral-bg-color: var(--bg);
    --fc-neutral-text-color: var(--text);
    --fc-border-color: var(--border);
    --fc-button-text-color: var(--text);
    --fc-button-bg-color: var(--card);
    --fc-button-border-color: var(--border);
    --fc-button-hover-bg-color: var(--bg);
    --fc-button-hover-border-color: var(--border);
    --fc-button-active-bg-color: var(--bg);
    --fc-button-active-border-color: var(--border);
    --fc-today-bg-color: rgba(105, 234, 155, .12);
    --fc-highlight-color: rgba(105, 234, 155, .18);
    --fc-list-event-hover-bg-color: var(--bg);
    color: var(--text);
  }
</style>
<div class="calendar-wide">
<h2>Content calendar</h2>
<p class="muted">
  Legend:
  <span class="badge" style="background:#DC4C4C;color:#fff">Ordered</span>
  <span class="badge" style="background:#6F8EFF;color:#fff">In Production</span>
  <span class="badge" style="background:#F5B942;color:#0D302D">Ready</span>
  <span class="badge" style="background:#134440;color:#fff">Scheduled</span>
  <span class="badge" style="background:#3FD27E;color:#0D302D">Published</span>
</p>
<p class="muted">Drag an item to a new day to reschedule it. Click it to publish or open it.</p>

<div style="margin:10px 0 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap">
  <label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:500">
    <input type="checkbox" class="cal-filter" value="planned" checked style="width:auto;margin:0"> Planned
  </label>
  <label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:500">
    <input type="checkbox" class="cal-filter" value="scheduled" checked style="width:auto;margin:0"> Scheduled
  </label>
  <label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:500">
    <input type="checkbox" class="cal-filter" value="published" checked style="width:auto;margin:0"> Published
  </label>
  <label style="display:flex;gap:6px;align-items:center;margin:0 0 0 auto;font-weight:500">
    From <input type="date" id="cal-date-from" style="width:150px;margin:0">
  </label>
  <label style="display:flex;gap:6px;align-items:center;margin:0;font-weight:500">
    To <input type="date" id="cal-date-to" style="width:150px;margin:0">
  </label>
  <button type="button" class="btn secondary" id="cal-date-clear" style="padding:4px 10px;font-size:13px">Clear dates</button>
  <input type="text" id="cal-search" placeholder="Search tasks…" style="width:220px;margin:0">
</div>

<div id="cal-status-summary" style="display:none;margin:0 0 16px;gap:8px;flex-wrap:wrap;align-items:center"></div>

<div style="margin:0 0 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
  <label class="platform-chip" data-platform="instagram">
    <input type="checkbox" class="cal-platform-filter" value="instagram" checked>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.3" cy="6.7" r=".6" fill="currentColor" stroke="none"/>
    </svg>
    Instagram
  </label>
  <label class="platform-chip" data-platform="linkedin">
    <input type="checkbox" class="cal-platform-filter" value="linkedin" checked>
    <svg viewBox="0 0 24 24" fill="currentColor">
      <rect x="2.5" y="9" width="4" height="12" rx="1"/>
      <circle cx="4.5" cy="4.3" r="2.3"/>
      <path d="M9.5 9h4v2.2c.9-1.6 2.6-2.6 4.5-2.6 3.7 0 5.5 2.3 5.5 6.5V21h-4v-5.3c0-1.9-.7-3.2-2.4-3.2-1.3 0-2.1.9-2.5 1.8-.1.3-.1.7-.1 1.1V21h-4V9z"/>
    </svg>
    LinkedIn
  </label>
</div>

<div id="calendar"></div>
</div>

<dialog id="event-modal" style="border:none;border-radius:20px;padding:0;width:640px;max-width:92vw;max-height:88vh;overflow-y:auto">
  <div class="card" style="margin:0;border:none">
    <h3 id="event-modal-title" style="margin:0 0 14px"></h3>
    <div id="event-modal-preview"></div>
    <form id="event-modal-publish-form" method="post">
      <label>Publish date &amp; time</label>
      <input type="datetime-local" id="event-modal-datetime" name="scheduled_at" required>

      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <label style="margin-bottom:0">Description</label>
        <button type="button" class="btn secondary" id="btn-generate-caption"
                style="padding:2px 10px;font-size:12px">Generate caption</button>
      </div>
      <textarea id="event-modal-caption" name="caption" placeholder="Caption for this post"></textarea>
      <p id="event-modal-caption-status" class="muted" style="margin:4px 0 0;font-size:12px"></p>

      <label>First comment (optional)</label>
      <textarea id="event-modal-first-comment" name="first_comment" placeholder="Auto-posted right after publishing — Facebook/Instagram/LinkedIn/YouTube only" style="min-height:60px"></textarea>

      <p id="event-modal-status" class="muted" style="margin:8px 0 0;font-size:12px"></p>

      <div style="display:flex;gap:10px;margin-top:14px">
        <a id="event-modal-modify" class="btn secondary" style="flex:1;text-align:center">To modify</a>
        <button class="btn" type="submit" style="flex:1">Confirm &amp; publish</button>
      </div>
    </form>
    <button type="button" class="btn secondary" style="width:100%;margin-top:10px"
            onclick="document.getElementById('event-modal').close()">Cancel</button>
  </div>
</dialog>

<dialog id="preview-lightbox">
  <img id="preview-lightbox-img" src="" alt="Preview">
</dialog>

<script>
document.addEventListener('DOMContentLoaded', function () {
  const calendarEl = document.getElementById('calendar');
  const filterBoxes = document.querySelectorAll('.cal-filter');
  const platformBoxes = document.querySelectorAll('.cal-platform-filter');
  const searchInput = document.getElementById('cal-search');
  const dateFromInput = document.getElementById('cal-date-from');
  const dateToInput = document.getElementById('cal-date-to');
  const dateClearBtn = document.getElementById('cal-date-clear');
  const summaryEl = document.getElementById('cal-status-summary');
  const modal = document.getElementById('event-modal');

  // Per-status label/color, same as the Board and the legend above the
  // grid — used to render the "In this range: Ordered 10 · Scheduled 20 ·
  // Published 100" summary bar once a custom date range is picked.
  const STATUS_META = {{ status_meta_json | safe }};

  function activeBuckets() {
    return Array.from(filterBoxes).filter(cb => cb.checked).map(cb => cb.value);
  }

  function activePlatforms() {
    return Array.from(platformBoxes).filter(cb => cb.checked).map(cb => cb.value);
  }

  // Only Instagram/LinkedIn have a chip right now — anything else (no
  // platform set, or a platform without its own chip yet) always shows,
  // so this filter can never silently hide a task there's no toggle for.
  const FILTERABLE_PLATFORMS = Array.from(platformBoxes).map(cb => cb.value);
  function matchesPlatform(e, active) {
    if (!e.platform || !FILTERABLE_PLATFORMS.includes(e.platform)) return true;
    return active.includes(e.platform);
  }

  function matchesSearch(e, term) {
    if (!term) return true;
    const haystack = ((e.projectTitle || e.title || '') + ' ' + (e.accountLabel || '')).toLowerCase();
    return haystack.includes(term);
  }

  // "From"/"To" filter on the same pub date (e.start, "YYYY-MM-DD") the
  // event is actually placed on the grid by — a custom window like
  // "10/7 - 5/8" independent of whichever month/week the grid happens to
  // be showing right now.
  function matchesDateRange(e, from, to) {
    if (!e.start) return !from && !to;
    if (from && e.start < from) return false;
    if (to && e.start > to) return false;
    return true;
  }

  // Tallies the currently-filtered events by their raw status (not just
  // the coarser planned/scheduled/published bucket) and renders a pill
  // per status that actually has a count — this is the "10 ordered, 20
  // scheduled, 100 published" summary, scoped to whatever date range (and
  // any other active filter) is currently picked. Hidden entirely with no
  // date range set, since "everything, forever" isn't really a useful
  // count to show at a glance.
  function renderStatusSummary(events, hasRange) {
    if (!hasRange) {
      summaryEl.style.display = 'none';
      summaryEl.innerHTML = '';
      return;
    }
    const counts = {};
    events.forEach(function (e) {
      const s = e.status || 'unknown';
      counts[s] = (counts[s] || 0) + 1;
    });
    const keys = Object.keys(counts);
    if (!keys.length) {
      summaryEl.style.display = 'flex';
      summaryEl.innerHTML = '<span class="muted" style="font-size:13px">In this range: nothing yet.</span>';
      return;
    }
    summaryEl.style.display = 'flex';
    summaryEl.innerHTML = '<span class="muted" style="font-size:13px">In this range:</span>' +
      keys.map(function (s) {
        const meta = STATUS_META[s] || { label: s, color: '#6B7280', textColor: '#fff' };
        return '<span class="badge" style="background:' + meta.color + ';color:' + meta.textColor + '">' +
          escapeHtml(meta.label) + ': ' + counts[s] + '</span>';
      }).join('');
  }

  // Small platform logo shown in the corner of every Calendar card, so
  // it's obvious at a glance which platform a task is for. Plain inline
  // SVGs (no external icon library) — simplified glyphs, not exact brand
  // artwork, in each platform's usual color.
  const PLATFORM_ICONS = {
    instagram:
      '<svg viewBox="0 0 24 24" fill="none" stroke="#C13584" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">' +
        '<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/>' +
        '<circle cx="17.3" cy="6.7" r=".7" fill="#C13584" stroke="none"/>' +
      '</svg>',
    linkedin:
      '<svg viewBox="0 0 24 24" fill="#0A66C2">' +
        '<rect x="2.5" y="9" width="4" height="12" rx="1"/><circle cx="4.5" cy="4.3" r="2.3"/>' +
        '<path d="M9.5 9h4v2.2c.9-1.6 2.6-2.6 4.5-2.6 3.7 0 5.5 2.3 5.5 6.5V21h-4v-5.3c0-1.9-.7-3.2-2.4-3.2-1.3 0-2.1.9-2.5 1.8-.1.3-.1.7-.1 1.1V21h-4V9z"/>' +
      '</svg>',
    facebook:
      '<svg viewBox="0 0 24 24" fill="#1877F2">' +
        '<path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.5.3v2.7h-1.4c-1.2 0-1.6.8-1.6 1.6V12h2.9l-.5 2.9h-2.4v7A10 10 0 0 0 22 12z"/>' +
      '</svg>',
    tiktok:
      '<svg viewBox="0 0 24 24" fill="#010101">' +
        '<path d="M16.6 5.8a4.4 4.4 0 0 1-3-1.4v9.9a4.9 4.9 0 1 1-4.2-4.9v2.4a2.5 2.5 0 1 0 1.8 2.4V2h2.3a4.4 4.4 0 0 0 3.1 3.8v2z"/>' +
      '</svg>'
  };
  function platformBadge(platform) {
    const icon = PLATFORM_ICONS[platform];
    return icon ? '<div class="cal-platform-badge">' + icon + '</div>' : '';
  }

  function escapeHtml(s) {
    return (s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // Shows what will actually get sent to OneUp — same Drive link handling
  // as the real publish, just read-only (well, minus the drag/remove
  // controls below, which *do* write back — see savePreviewOrder()).
  // Zips can take a few seconds to download and unpack, so this shows a
  // loading state while it works, and ignores its own result if the boss
  // has already clicked into a different task by the time it comes back.
  let previewRequestId = 0;
  let currentPreviewOrderId = null;
  let draggedPreviewIndex = null;

  // Every preview thumbnail's URL ends in its stable key: for a Drive
  // photo that's /media/<random-token>/<safe-name> (token is fresh every
  // request, but the trailing filename is the same secure_filename the
  // backend keys it by); for an uploaded photo it's /orders/<id>/
  // uploaded-media/<media-id>/<key> (permanent, doesn't change). Either
  // way, that trailing key is what actually gets saved to order.media_
  // order via savePreviewOrder(), not the full URL.
  function filenameFromPreviewUrl(url) {
    return url.split('/').pop();
  }

  function loadMediaPreview(orderId) {
    const wrap = document.getElementById('event-modal-preview');
    const thisRequest = ++previewRequestId;
    currentPreviewOrderId = orderId;
    wrap.innerHTML = '<p class="muted" style="margin:0 0 10px;font-size:12px">Loading preview…</p>';
    fetch('/orders/' + orderId + '/media-preview')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (thisRequest !== previewRequestId) return;
        renderPreviewStrip(orderId, data.images || [], data.error || null);
      })
      .catch(function () {
        if (thisRequest !== previewRequestId) return;
        renderPreviewStrip(orderId, [], "Couldn't load a preview.");
      });
  }

  // Always renders the strip (if there's anything to show) *and* the
  // controls row below it (Add photo / Reset order / status line) —
  // even on an empty or errored preview, so the boss can still add a
  // photo to a task that has no Drive link yet, or work around a bad zip
  // by uploading replacements directly.
  function renderPreviewStrip(orderId, urls, errorMessage) {
    const wrap = document.getElementById('event-modal-preview');
    const canRemove = urls.length > 1;
    let html = '';
    if (errorMessage) {
      html += '<p class="muted" style="margin:0 0 10px;font-size:12px">' + escapeHtml(errorMessage) + '</p>';
    } else if (!urls.length) {
      html += '<p class="muted" style="margin:0 0 10px;font-size:12px">No photos yet — add one below.</p>';
    } else {
      html += '<div class="preview-strip" id="preview-strip">' +
        urls.map(function (u, i) {
          return '<div class="preview-item" draggable="true" data-index="' + i + '">' +
            '<img src="' + u + '" loading="lazy" onclick="openLightbox(this.src)">' +
            (canRemove
              ? '<button type="button" class="preview-remove" title="Remove this photo" onclick="removePreviewPhoto(' + i + ')">&times;</button>'
              : '') +
            '</div>';
        }).join('') +
        '</div>';
    }
    html +=
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 6px;flex-wrap:wrap">' +
        '<p class="muted" style="margin:0;font-size:12px">Drag to reorder, click &times; to remove. Changes save automatically and apply to OneUp.</p>' +
        '<div style="display:flex;gap:8px;flex-shrink:0">' +
          '<label class="btn secondary" style="padding:2px 10px;font-size:12px;margin:0;cursor:pointer">+ Add photo' +
            '<input type="file" accept="image/*" multiple style="display:none" onchange="uploadPreviewPhotos(' + orderId + ', this)">' +
          '</label>' +
          (urls.length
            ? '<button type="button" class="btn secondary" style="padding:2px 10px;font-size:12px" onclick="resetPreviewOrder(' + orderId + ')">Reset order</button>'
            : '') +
        '</div>' +
      '</div>' +
      '<p id="preview-upload-status" class="muted" style="margin:0 0 10px;font-size:12px"></p>';

    wrap.innerHTML = html;
    if (!urls.length) return;

    const strip = document.getElementById('preview-strip');
    strip.querySelectorAll('.preview-item').forEach(function (item) {
      item.addEventListener('dragstart', function () {
        draggedPreviewIndex = Number(item.dataset.index);
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', function () {
        item.classList.remove('dragging');
        strip.querySelectorAll('.preview-item').forEach(function (el) { el.classList.remove('drag-over'); });
      });
      item.addEventListener('dragover', function (e) {
        e.preventDefault();
        item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', function () {
        item.classList.remove('drag-over');
      });
      item.addEventListener('drop', function (e) {
        e.preventDefault();
        item.classList.remove('drag-over');
        const targetIndex = Number(item.dataset.index);
        if (draggedPreviewIndex === null || draggedPreviewIndex === targetIndex) return;
        const visible = urls.map(filenameFromPreviewUrl);
        const reordered = urls.slice();
        const [moved] = reordered.splice(draggedPreviewIndex, 1);
        reordered.splice(targetIndex, 0, moved);
        draggedPreviewIndex = null;
        renderPreviewStrip(orderId, reordered, null);
        savePreviewOrder(orderId, reordered.map(filenameFromPreviewUrl), visible);
      });
    });
  }

  window.removePreviewPhoto = function (index) {
    const strip = document.getElementById('preview-strip');
    const urls = Array.from(strip.querySelectorAll('.preview-item img')).map(function (img) { return img.getAttribute('src'); });
    if (urls.length <= 1) return; // last photo — button isn't even rendered in this case
    const visible = urls.map(filenameFromPreviewUrl);
    urls.splice(index, 1);
    renderPreviewStrip(currentPreviewOrderId, urls, null);
    savePreviewOrder(currentPreviewOrderId, urls.map(filenameFromPreviewUrl), visible);
  };

  window.resetPreviewOrder = function (orderId) {
    savePreviewOrder(orderId, []);
    loadMediaPreview(orderId);
  };

  // Uploads one or more photos straight into Content Ops for this task
  // (on top of whatever's pulled from Drive) and refreshes the preview —
  // the new photo(s) land at the end of the strip, ready to drag
  // wherever they belong.
  window.uploadPreviewPhotos = function (orderId, input) {
    const files = input.files;
    if (!files || !files.length) return;
    const statusEl = document.getElementById('preview-upload-status');
    const formData = new FormData();
    Array.from(files).forEach(function (f) { formData.append('photos', f); });
    if (statusEl) statusEl.textContent = 'Uploading…';
    fetch('/orders/' + orderId + '/upload-media', { method: 'POST', body: formData })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        input.value = '';
        if (!data.ok) {
          alert(data.error || "Couldn't upload that photo.");
          loadMediaPreview(orderId);
          return;
        }
        loadMediaPreview(orderId);
      })
      .catch(function () {
        input.value = '';
        alert('Network error uploading photo — try again.');
        loadMediaPreview(orderId);
      });
  };

  function savePreviewOrder(orderId, filenames, visible) {
    fetch('/orders/' + orderId + '/set-media-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filenames: filenames, visible: visible || filenames })
    }).catch(function () {
      // Best-effort autosave — if this one request fails, the next publish
      // just falls back to whatever selection/order was last saved
      // successfully (or the full natural order if nothing ever was), so
      // it's safe to stay quiet here rather than interrupt the boss.
    });
  }

  const calendar = new FullCalendar.Calendar(calendarEl, {
    initialView: 'dayGridMonth',
    height: 'auto',
    editable: true,
    firstDay: 1, // Monday, not Sunday
    allDayText: '',
    headerToolbar: {
      left: 'prev,next today',
      center: 'title',
      right: 'dayGridMonth,dayGridWeek,listMonth'
    },
    events: function (info, successCallback, failureCallback) {
      fetch("{{ url_for('orders_json') }}")
        .then(r => r.json())
        .then(data => {
          const active = activeBuckets();
          const activePlats = activePlatforms();
          const term = (searchInput.value || '').trim().toLowerCase();
          const dateFrom = dateFromInput.value || '';
          const dateTo = dateToInput.value || '';
          const filtered = data.events.filter(e =>
            active.includes(e.bucket) && matchesSearch(e, term) && matchesPlatform(e, activePlats) &&
            matchesDateRange(e, dateFrom, dateTo)
          );
          renderStatusSummary(filtered, Boolean(dateFrom || dateTo));
          successCallback(filtered);
        })
        .catch(failureCallback);
    },
    // Chronological first (13:30 before 18:00 before 21:00), then grouped
    // by project name as a tie-break. Since every language of the same
    // project is normally scheduled at the same time, this reads as both
    // "in time order" and "same project together" at once — the earlier
    // version sorted by project name first, which scrambled the time order.
    eventOrder: function (a, b) {
      const sa = a.extendedProps.scheduledAt || '';
      const sb = b.extendedProps.scheduledAt || '';
      if (sa < sb) return -1;
      if (sa > sb) return 1;
      const ta = (a.extendedProps.projectTitle || a.title || '').toLowerCase();
      const tb = (b.extendedProps.projectTitle || b.title || '').toLowerCase();
      if (ta < tb) return -1;
      if (ta > tb) return 1;
      const aa = (a.extendedProps.accountLabel || '').toLowerCase();
      const ab = (b.extendedProps.accountLabel || '').toLowerCase();
      if (aa < ab) return -1;
      if (aa > ab) return 1;
      return 0;
    },
    eventContent: function (arg) {
      const props = arg.event.extendedProps;
      const bg = arg.event.backgroundColor || '#6B7280';
      const fg = arg.event.textColor || '#fff';
      const title = props.projectTitle || arg.event.title;
      const account = props.accountLabel || '';
      const badge = platformBadge(props.platform);
      // Card start/end dates are date-only (no time) so drag-and-drop can
      // move an item between days without touching its pub time — the real
      // pub time lives in scheduledAt, set once a time has actually been
      // chosen (via the publish-confirmation popup or the Board).
      const start = props.scheduledAt ? new Date(props.scheduledAt) : null;
      const timeShort = start
        ? start.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })
        : '';
      const timeLong = start
        ? start.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
        : '';

      if (arg.view.type === 'dayGridMonth') {
        return {
          html:
            '<div class="cal-event-compact" style="background:' + bg + ';color:' + fg + '">' +
              (timeShort ? '<span class="time">' + timeShort + '</span>' : '') +
              '<span class="txt">' + escapeHtml(title) + '</span>' +
              badge +
            '</div>'
        };
      }
      return {
        html:
          '<div class="cal-event-rich" style="background:' + bg + ';color:' + fg + '">' +
            (timeLong ? '<div class="time">' + timeLong + '</div>' : '') +
            '<div class="proj">' + escapeHtml(title) + '</div>' +
            (account ? '<div class="acct">' + escapeHtml(account) + '</div>' : '') +
            badge +
          '</div>'
      };
    },
    eventClick: function (info) {
      info.jsEvent.preventDefault();
      const props = info.event.extendedProps;
      const label = (props.projectTitle || info.event.title) + (props.accountLabel ? ' — ' + props.accountLabel : '');
      document.getElementById('event-modal-title').textContent = label;
      document.getElementById('event-modal-datetime').value = props.scheduledAt || (info.event.startStr.slice(0, 10) + 'T12:00');
      document.getElementById('event-modal-caption').value = props.caption || '';
      document.getElementById('event-modal-first-comment').value = props.firstComment || '';
      document.getElementById('event-modal-modify').href = info.event.url;
      document.getElementById('event-modal-publish-form').action = '/orders/' + info.event.id + '/publish-now';
      document.getElementById('event-modal-caption-status').textContent = '';
      document.getElementById('btn-generate-caption').dataset.orderId = info.event.id;
      loadMediaPreview(info.event.id);
      modal.showModal();
    },
    eventDrop: function (info) {
      const newDate = info.event.startStr.slice(0, 10);
      const existingTime = (info.event.extendedProps.scheduledAt || '').slice(11, 16) || '12:00';
      // If this task is already actively scheduled in OneUp, the backend
      // also cancels and re-creates the real OneUp post at the new time
      // (OneUp has no "just move the time" endpoint) — that's why this
      // needs the AJAX header and a moment longer than a plain save.
      fetch(`/orders/${info.event.id}/set-date`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/x-www-form-urlencoded',
          'X-Requested-With': 'XMLHttpRequest'
        },
        body: 'scheduled_at=' + encodeURIComponent(newDate + 'T' + existingTime)
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data.ok) {
            // The backend already rolled back the date change itself
            // whenever it couldn't confirm the real OneUp post actually
            // moved too — snap the card back to match, right after
            // explaining why.
            alert(data.error || "Couldn't move this task.");
            info.revert();
            return;
          }
          calendar.refetchEvents();
        })
        .catch(function () { info.revert(); });
    }
  });

  const lightbox = document.getElementById('preview-lightbox');
  lightbox.addEventListener('click', function () { lightbox.close(); });
  window.openLightbox = function (src) {
    document.getElementById('preview-lightbox-img').src = src;
    lightbox.showModal();
  };

  // Publish via fetch instead of a normal form submit, so a successful
  // publish just closes the popup and refreshes the events in place —
  // no full page reload, which used to bounce the boss back to month view
  // and clear whatever they'd typed into the search box.
  document.getElementById('event-modal-publish-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const form = e.target;
    const statusEl = document.getElementById('event-modal-status');
    const btn = form.querySelector('button[type="submit"]');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Publishing…';
    statusEl.textContent = '';
    fetch(form.action, {
      method: 'POST',
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
      body: new FormData(form),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        btn.textContent = originalText;
        if (!data.ok) {
          statusEl.style.color = '#DC4C4C';
          statusEl.textContent = data.error || 'Something went wrong.';
          return;
        }
        modal.close();
        calendar.refetchEvents();
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = originalText;
        statusEl.style.color = '#DC4C4C';
        statusEl.textContent = 'Network error — try again.';
      });
  });

  // Drafts a caption from this task's actual photos via Claude (see
  // /orders/<id>/generate-caption). Never touches anything already typed
  // without asking first, since the boss might have already written or
  // tweaked a caption by hand.
  document.getElementById('btn-generate-caption').addEventListener('click', function () {
    const btn = this;
    const orderId = btn.dataset.orderId;
    const textarea = document.getElementById('event-modal-caption');
    const statusEl = document.getElementById('event-modal-caption-status');
    if (textarea.value.trim() && !confirm('Replace the current description with an AI-generated one?')) {
      return;
    }
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Generating…';
    statusEl.style.color = '';
    statusEl.textContent = 'Reading photos and asking Claude for a draft…';
    fetch('/orders/' + orderId + '/generate-caption', {
      method: 'POST',
      headers: { 'X-Requested-With': 'XMLHttpRequest' },
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        btn.textContent = originalText;
        if (!data.ok) {
          statusEl.style.color = '#DC4C4C';
          statusEl.textContent = data.error || 'Something went wrong.';
          return;
        }
        textarea.value = data.caption;
        statusEl.style.color = '';
        statusEl.textContent = 'Draft added — review before publishing.';
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = originalText;
        statusEl.style.color = '#DC4C4C';
        statusEl.textContent = 'Network error — try again.';
      });
  });

  filterBoxes.forEach(function (cb) {
    cb.addEventListener('change', function () { calendar.refetchEvents(); });
  });
  platformBoxes.forEach(function (cb) {
    cb.addEventListener('change', function () { calendar.refetchEvents(); });
  });

  let searchDebounce;
  searchInput.addEventListener('input', function () {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function () { calendar.refetchEvents(); }, 250);
  });

  dateFromInput.addEventListener('change', function () { calendar.refetchEvents(); });
  dateToInput.addEventListener('change', function () { calendar.refetchEvents(); });
  dateClearBtn.addEventListener('click', function () {
    dateFromInput.value = '';
    dateToInput.value = '';
    calendar.refetchEvents();
  });

  calendar.render();
});
</script>
{% endblock %}
