{% extends "base.html" %}
{% block title %}Set up{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-box card">
    <h2 style="margin-top:0">Welcome — set up your account</h2>
    <p class="muted">This runs once. You'll be the first "boss" account; you can add producers afterwards under Team.</p>
    <form method="post">
      <label>Your name</label>
      <input type="text" name="name" required autofocus>
      <label>Your email</label>
      <input type="email" name="email" required>
      <label>Choose a password</label>
      <input type="password" name="password" required minlength="6">
      <div style="margin-top:18px">
        <button class="btn" type="submit" style="width:100%">Create account</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
